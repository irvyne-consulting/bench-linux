          exit $rc
      - name: Result
        working-directory: linux
        run: |
          ls -l arch/x86/boot/bzImage vmlinux
          echo "modules built: $(find . -name '*.ko' | wc -l)"
          echo "kernel release: $(make -s kernelrelease)"
          du -sh . | cut -f1 | sed 's/^/tree after build: /'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-controlled-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
