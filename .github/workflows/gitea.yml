# ICR benchmark — gitea (Go): go-gitea/gitea's own `test-unit` job from `pull-db-tests.yml` — `make deps-backend`,
# `make generate-go`, `make test-backend` with the race detector twice (tags bindata, then bindata gogit), `make test-check` —
# with its Elasticsearch, Meilisearch, Redis, MinIO and Azurite service containers (upstream's own digest pins), Go from go.mod
# through upstream's `go-setup` action with its module/build cache restore switched off, from a clean checkout of the pinned
# upstream commit, on GitHub-hosted and ICR runners. `GITHUB_READ_TOKEN` is not provided (no such secret here): the GitHub
# migration test replays its recorded fixtures, as on every fork pull request upstream. Only Irvyne starts a run.
name: gitea

on:
  workflow_dispatch:
    inputs:
      legs:
        description: JSON list of runner labels to measure (the legs of one project run together)
        default: '["ubuntu-latest", "ubuntu-26.04", "icr-2c", "icr-4c", "icr-8c"]'
        type: string
      note:
        description: free text echoed in the run (campaign, block, host condition)
        default: ""
        type: string

permissions:
  contents: read

env:
  UPSTREAM: go-gitea/gitea
  UPSTREAM_REF: cdf786ce92b9b5d5d3c624408dc92b6261fe4601   # main, 2026-09-19

jobs:
  bench:
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.leg }}
    environment: icr-bench
    timeout-minutes: 120
    services:
      elasticsearch:
        image: elasticsearch:8.19.15@sha256:8ff844933190136cec601777d633453f4008cc126a652257d5f63cd8e92207ef
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.ml.enabled: false
          ingest.geoip.downloader.enabled: false
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - "9200:9200"
      meilisearch:
        image: getmeili/meilisearch:v1@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
        env:
          MEILI_ENV: development # disable auth
        ports:
          - "7700:7700"
      redis:
        image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        options: >- # wait until redis has started
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
      minio:
        image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
        env:
          MINIO_ROOT_USER: 123456
          MINIO_ROOT_PASSWORD: 12345678
        ports:
          - "9000:9000"
      devstoreaccount1.azurite.local: # https://github.com/Azure/Azurite/issues/1583
        image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:f9791d0a0613e93057c06ae31f7ac0c0222f0530590e67e020b0986c66a36fa6
        ports:
          - 10000:10000
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.legs) }}
    steps:
      - name: Checkout upstream at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: go-gitea/gitea
          ref: cdf786ce92b9b5d5d3c624408dc92b6261fe4601
          persist-credentials: false
      - name: Runner facts
        env:
          LEG: ${{ matrix.leg }}
          NOTE: ${{ inputs.note }}
        run: |
          echo "leg=$LEG note=$NOTE runner=$RUNNER_NAME cpus=$(nproc) mem=$(free -g | awk '/Mem/ {print $2}')G kernel=$(uname -r) os=$(. /etc/os-release && echo "$PRETTY_NAME") docker=$(docker --version) upstream=$UPSTREAM@$(git rev-parse HEAD)"
          echo "go on the image: $(go version 2>/dev/null || echo none) — go.mod: $(grep -E '^(go|toolchain) ' go.mod | tr '\n' ' ')"
      # upstream's step: free-disk-space, then actions/setup-go (pinned by commit upstream, v7) with go-version-file: go.mod,
      # check-latest: true and cache: false; the composite's own Go module/build cache restore is switched off (cold by design)
      - name: Set up Go (upstream's go-setup action, no cache)
        uses: ./.github/actions/go-setup
        with:
          cache: "false"
      - name: Add hosts to /etc/hosts
        run: '[ -e "/.dockerenv" ] || [ -e "/run/.containerenv" ] || echo "127.0.0.1 minio devstoreaccount1.azurite.local mysql elasticsearch meilisearch smtpimap" | sudo tee -a /etc/hosts'
      - run: make deps-backend
      - run: make generate-go
        env:
          TAGS: bindata
      # upstream's two test steps, output also written to a file for the evidence (bash: pipefail keeps the exit status)
      - name: unit-tests
        shell: bash
        run: make test-backend 2>&1 | tee "$RUNNER_TEMP/test-backend.log"
        env:
          GOTEST_FLAGS: -race -timeout=20m
          TAGS: bindata
      - name: unit-tests-gogit
        shell: bash
        run: make test-backend 2>&1 | tee "$RUNNER_TEMP/test-backend-gogit.log"
        env:
          GOTEST_FLAGS: -race -timeout=20m
          TAGS: bindata gogit
          GITEA_TEST_CI_SKIP_EXTERNAL: true
      - run: make test-check
      - name: Evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/test-backend*.log "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          { go version; go env GOVERSION GOTOOLCHAIN GOFLAGS CGO_ENABLED GOMODCACHE GOCACHE; } > "$RUNNER_TEMP/evidence/go.txt" 2>&1 || true
          cp go.mod go.sum "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          docker images --digests --format '{{.Repository}}:{{.Tag}} {{.Digest}}' > "$RUNNER_TEMP/evidence/images.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-gitea-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
